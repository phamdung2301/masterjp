# Render Blueprint — Master JP (infrastructure as code).
#
# MỤC ĐÍCH: version hoá cấu hình deploy trong git, để không bao giờ "quên"
# cấu hình production nữa. Đặc biệt là rewrite SPA của frontend (xem dưới).
#
# LƯU Ý QUAN TRỌNG:
# - Hai service hiện tại (masterjp, masterjp-fe) được tạo bằng tay trên Dashboard.
#   File này KHÔNG tự áp dụng cho chúng — muốn dùng Blueprint thì phải tạo lại
#   service từ file này (hoặc giữ service cũ và làm bước 2 bằng tay).
# - Vì vậy, FIX NGAY cho lỗi "reload URL bất kỳ → 404/trắng trang" là:
#   Dashboard → service masterjp-fe → Redirects/Rewrites → Add Rule:
#     Source: /*   Destination: /index.html   Type: Rewrite
#   (Rule này đã được khai báo dưới đây cho service masterjp-fe để lần sau
#   tạo lại service không bị mất.)
# - Secrets (MONGODB_URI, JWT_SECRET, ...) KHÔNG commit vào repo:
#   khai báo sync: false để Render hiểu giá trị nằm trên Dashboard.

services:
  # ---- Backend: Spring Boot (Docker) ----
  - type: web
    name: masterjp
    runtime: docker
    repo: https://github.com/phamdung2301/masterjp
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: masterjp
      - key: JWT_SECRET
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEV_LOG_CODE
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      - key: SHARING_ALLOWED_PLANS
        sync: false
      - key: FRONTEND_URL
        value: https://masterjp-fe.onrender.com
      - key: APP_TIMEZONE
        value: Asia/Ho_Chi_Minh

  # ---- Frontend: React SPA (Static Site) ----
  - type: web
    name: masterjp-fe
    env: static
    repo: https://github.com/phamdung2301/masterjp
    branch: main
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    # API base cho production — PHẢI kết thúc bằng /api, không trailing slash.
    envVars:
      - key: VITE_API_BASE_URL
        value: https://masterjp.onrender.com/api
    # FIX DỨT ĐIỂM lỗi reload deep URL → 404/trắng trang:
    # production KHÔNG có Vite dev proxy — mọi path không phải file tĩnh
    # đều phải trả về index.html để React Router xử lý client-side.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
