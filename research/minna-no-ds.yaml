#   Vocabulary
# --------------
# Each lesson consists of a list of words.
#
# Words are formatted as follows :
#
#   - id: [<int: lesson number>, <int: word number>]
#     edition: [<int: edition(s) in which the word is found>]
#     kanji: <str: kanji>
#     kana: <str: kana>
#     romaji: <str: romaji>
#     meaning: {
#       en: <str: english meaning>,
#       fr: <str: french meaning>,
#     }

lesson-01:
